<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Geometric document/data accent integrated into the design -->
  <g>
    <!-- Document icon with data layers -->
    <rect x="4" y="8" width="24" height="32" stroke="#14366F" stroke-width="2.5" fill="none"/>
    <rect x="10" y="14" width="12" height="2" fill="#14366F" opacity="0.6"/>
    <rect x="10" y="20" width="12" height="2" fill="#14366F" opacity="0.4"/>
    <rect x="10" y="26" width="8" height="2" fill="#14366F" opacity="0.3"/>
    <!-- Small data extraction arrow -->
    <path d="M28 24 L36 24" stroke="#14366F" stroke-width="2" stroke-linecap="round"/>
    <path d="M33 20 L37 24 L33 28" stroke="#14366F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- LNA wordmark — weight 600 per v4 -->
  <text x="44" y="34" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#14366F" letter-spacing="-0.02em">LNA</text>
</svg>
